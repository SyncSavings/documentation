components:
  schemas:
    ValidationErrorResponse:
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum: ['validation_error']
                description: The error code for the response. `validation_error` is used for validation issues.
              title:
                type: string
                example: 'Validation Failed'
                description: A human-readable summary of the problem
              detail:
                type: string
                description: A human-readable explanation specific to this occurrence of the problem
              meta:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: amount must be a number conforming to the specified constraints
                          description: A comprehensive error message regarding this validation problem.
    Dates:
      properties:
        createdAt:
          type: string
          example: '2024-12-31T00:00:00.000Z'
          description: The time that the resource was created
        updatedAt:
          type: string
          example: '2024-12-31T00:00:00.000Z'
          description: The time that the resource was most recently updated
    Search:
      properties:
          page:
            type: integer
            minimum: 1
            default: 1
            example: 1
            description: The page of results to return, starting at 1
          limit:
            type: integer
            minimum: 1
            default: 10
            example: 10
            description: The maximum number of results to return per page
          sortBy:
            type: string
            enum: ['createdAt', 'updatedAt']
            example: createdAt
            description: The field to sort results by. Without it, results use the endpoint's default order
          sortOrder:
            type: string
            enum: ['asc', 'desc']
            default: asc
            example: desc
            description: The direction to sort results in. Only applies when `sortBy` is set
  parameters:
    Search:
      in: query
      name: search
      required: false
      style: form
      explode: true
      description: Pagination and sorting. Send each field as its own query parameter, e.g. `?page=2&limit=20&sortBy=createdAt&sortOrder=desc`
      schema:
        $ref: '#/components/schemas/Search'
